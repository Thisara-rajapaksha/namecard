<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thisara Rajapaksha</title>

<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.85);
    --chip: rgba(255, 255, 255, 0.12);
    --chip-hover: rgba(255, 255, 255, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Mobile (default) ---------- */
  .card {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 28px calc(56px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* Photo fills the card and fades into black */
  .hero {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 45%,
      rgba(0,0,0,0.85) 68%,
      #000 80%);
  }

  .content { position: relative; z-index: 1; }

  h1 {
    font-size: clamp(34px, 9vw, 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--muted);
    max-width: 280px;
  }

  .socials {
    display: flex;
    gap: 14px;
    margin-top: 28px;
  }

  .socials a {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--chip);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .socials a:hover,
  .socials a:focus-visible {
    background: var(--chip-hover);
    transform: translateY(-2px);
    outline: none;
  }

  .socials svg { width: 22px; height: 22px; fill: currentColor; }

  /* Gentle fade-in */
  .content > * {
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.6s ease forwards;
  }
  .content > *:nth-child(2) { animation-delay: 0.1s; }
  .content > *:nth-child(3) { animation-delay: 0.2s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .content > * { animation: none; opacity: 1; transform: none; }
  }

  /* ---------- Tablet / large phone ---------- */
  @media (min-width: 600px) {
    .card { max-width: 520px; padding-left: 40px; padding-right: 40px; }
    h1 { font-size: 46px; }
    .subtitle { font-size: 17px; max-width: 340px; }
  }

  /* ---------- Laptop / desktop: split layout ---------- */
  @media (min-width: 900px) {
    .card {
      max-width: none;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(380px, 1fr) minmax(420px, 1fr);
      align-items: center;
      padding: 0;
    }

    /* photo becomes the left half, fading to black on its right edge */
    .hero {
      position: relative;
      inset: auto;
      grid-column: 1;
      grid-row: 1;
      align-self: stretch;
    }
    .hero img { object-position: center 15%; }
    .hero::after {
      background: linear-gradient(to right,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,0.85) 85%,
        #000 100%);
    }

    .content {
      grid-column: 2;
      grid-row: 1;
      padding: 48px clamp(40px, 6vw, 120px) 48px 0;
      margin-left: -40px; /* tuck text slightly into the fade for a seamless join */
    }

    h1 {
      font-size: clamp(48px, 5vw, 80px);
      letter-spacing: -1.5px;
    }
    .subtitle {
      margin-top: 16px;
      font-size: clamp(18px, 1.6vw, 22px);
      max-width: 460px;
    }
    .socials { gap: 18px; margin-top: 40px; }
    .socials a { width: 54px; height: 54px; }
    .socials svg { width: 25px; height: 25px; }
  }

  /* Very short laptop screens: keep the photo from over-cropping */
  @media (min-width: 900px) and (max-height: 600px) {
    .card { min-height: 600px; }
  }
</style>
